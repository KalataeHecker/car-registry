<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Регистър на МПС</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">🏛️ РЕГИСТЪР НА МПС</div>
    <div class="login-btn" onclick="openLogin()">👤 Вход</div>
</div>

<!-- LOGIN -->
<div id="loginModal" class="modal">
    <div class="modal-box">
        <span class="close" onclick="closeLogin()">✖</span>
        <h2>Системен достъп</h2>
        <input id="username" placeholder="Потребител">
        <input type="password" id="password" placeholder="Парола">
        <button onclick="login()">Вход</button>
        <p id="error"></p>
    </div>
</div>

<!-- ADMIN PANEL -->
<div class="panel admin-only">
    <h3>➕ Добавяне на МПС</h3>

    <input type="file" id="imgFile" accept="image/*">

    <input id="plate" placeholder="Рег. номер">
    <input id="brand" placeholder="Марка">
    <input id="model" placeholder="Модел">
    <input id="year" placeholder="Година">
    <input id="owner" placeholder="Собственик">
    <input id="info" placeholder="Характеристики на собственика">

    <button onclick="addCar()">Запис в системата</button>
</div>

<!-- TABLE -->
<div class="table-container">
<table>
    <thead>
        <tr>
            <th>Снимка</th>
            <th>Рег. номер</th>
            <th>Марка</th>
            <th>Модел</th>
            <th>Година</th>
            <th>Собственик</th>
            <th>Действие</th>
        </tr>
    </thead>
    <tbody id="list"></tbody>
</table>
</div>

<!-- DETAILS -->
<div id="details" class="details"></div>

<script src="script.js"></script>
</body>
</html>
