<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Регистър на автомобили</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP -->
<div class="topbar">
    <div class="title">Регистър на автомобили</div>
    <div class="user" onclick="openLogin()">👤 Вход</div>
</div>

<!-- LOGIN -->
<div id="loginModal" class="modal">
    <div class="modal-box">
        <span class="close" onclick="closeLogin()">✖</span>
        <h2>Админ вход</h2>
        <input id="username" placeholder="Потребител">
        <input type="password" id="password" placeholder="Парола">
        <button onclick="login()">Вход</button>
        <p id="error"></p>
    </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin-panel admin-only">
    <h3>Добавяне на автомобил</h3>

    <input id="img" placeholder="URL на снимка">
    <input id="plate" placeholder="Регистрационен номер">
    <input id="brand" placeholder="Марка">
    <input id="model" placeholder="Модел">
    <input id="year" placeholder="Година">
    <input id="owner" placeholder="Собственик">
    <input id="info" placeholder="Характеристики на собственик">

    <button onclick="addCar()">Добави</button>
</div>

<!-- LIST -->
<div id="cars" class="grid"></div>

<!-- DETAILS -->
<div id="details" class="details"></div>

<script src="script.js"></script>
</body>
</html>
