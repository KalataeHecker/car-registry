<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Регистър на автомобили</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<div class="topbar">
    <div class="login" onclick="openLogin()">👤 Вход</div>
</div>

<!-- TITLE -->
<h1 class="title">РЕГИСТЪР НА АВТОМОБИЛИ</h1>

<!-- LOGIN -->
<div id="loginModal" class="modal">
    <div class="modal-box">
        <span class="close" onclick="closeLogin()">✖</span>
        <h2>Админ достъп</h2>
        <input id="username" placeholder="Потребител">
        <input type="password" id="password" placeholder="Парола">
        <button onclick="login()">Вход</button>
        <p id="error"></p>
    </div>
</div>

<!-- ADMIN PANEL -->
<div class="panel admin-only">
    <h3>Добавяне / редакция</h3>

    <input type="file" id="imgFile" accept="image/*">

    <input id="plate" placeholder="Рег. номер">
    <input id="brand" placeholder="Марка">
    <input id="model" placeholder="Модел">
    <input id="year" placeholder="Година">
    <input id="owner" placeholder="Собственик">
    <input id="info" placeholder="Характеристики">

    <button onclick="saveCar()">Запази</button>
</div>

<!-- GUEST VIEW -->
<div id="guestView" class="guest-box">
    <p>🔍 Системата е в режим само за преглед</p>
</div>

<!-- TABLE -->
<div class="table-box">
<table>
    <thead>
        <tr>
            <th>Снимка</th>
            <th>Рег. номер</th>
            <th>Марка</th>
            <th>Модел</th>
            <th>Година</th>
            <th>Собственик</th>
            <th class="admin-only">Действия</th>
        </tr>
    </thead>
    <tbody id="list"></tbody>
</table>
</div>

<script src="script.js"></script>
</body>
</html>
