<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Регистър на автомобили</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="logo">🏛️ Регистър на автомобили</div>
    <div class="user" onclick="openLogin()">👤 Вход</div>
</div>

<!-- LOGIN -->
<div id="loginModal" class="modal">
    <div class="modal-box">
        <span class="close" onclick="closeLogin()">✖</span>
        <h2>Админ достъп</h2>
        <input id="username" placeholder="Потребител">
        <input type="password" id="password" placeholder="Парола">
        <button onclick="login()">Вход</button>
        <p id="error"></p>
    </div>
</div>

<!-- GUEST VIEW -->
<div id="guestView">
    <h2 class="title">Популярни марки</h2>

    <div class="grid">
        <div class="card" onclick="openBrand('BMW')">BMW</div>
        <div class="card" onclick="openBrand('Audi')">Audi</div>
        <div class="card" onclick="openBrand('Mercedes')">Mercedes</div>
        <div class="card" onclick="openBrand('VW')">VW</div>
        <div class="card" onclick="openBrand('Toyota')">Toyota</div>
        <div class="card" onclick="openBrand('Ford')">Ford</div>
    </div>

    <div id="brandModels"></div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="adminView" class="hidden">

    <h2 class="title">Административен панел</h2>

    <!-- SEARCH -->
    <input id="search" placeholder="Търсене по рег. номер..." oninput="searchCar()">

    <div id="searchResult"></div>

    <!-- FORM -->
    <div class="panel">
        <h3>Добавяне / редакция</h3>

        <input type="file" id="imgFile">
        <input id="plate" placeholder="Рег. номер">
        <input id="brand" placeholder="Марка">
        <input id="model" placeholder="Модел">
        <input id="year" placeholder="Година">
        <input id="owner" placeholder="Собственик">
        <input id="info" placeholder="Информация">

        <button onclick="saveCar()">Запази</button>
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>Снимка</th>
                <th>Рег. номер</th>
                <th>Марка</th>
                <th>Модел</th>
                <th>Година</th>
                <th>Собственик</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="list"></tbody>
    </table>

</div>

<script src="script.js"></script>
</body>
</html>
