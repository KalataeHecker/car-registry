<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Регистър на автомобилите</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="logo">🚗 Vehicle Registry System</div>
    <div class="user" onclick="openLogin()">👤 Admin</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar">
    <h3>MENU</h3>
    <a href="#">Справка</a>
    <a href="#">Reports</a>
</div>

<!-- MAIN -->
<div class="main">

    <h1>Vehicle Register</h1>

    <div class="form admin-only">
        <input id="plate" placeholder="Plate Number">
        <input id="brand" placeholder="Brand">
        <input id="model" placeholder="Model">
        <button onclick="addCar()">ADD VEHICLE</button>
    </div>

    <input id="search" placeholder="Search vehicle...">

    <table>
        <thead>
            <tr>
                <th>Plate</th>
                <th>Brand</th>
                <th>Model</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="list"></tbody>
    </table>

    <button class="admin-only logout" onclick="logout()">Logout</button>

</div>

<!-- LOGIN -->
<div id="loginModal" class="modal">
    <div class="modal-box">
        <h2>Admin Login</h2>
        <input id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">LOGIN</button>
        <p id="error"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
