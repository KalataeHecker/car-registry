<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Регистър на автомобили</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="logo">🏛️ Регистър на автомобили</div>
    <div class="user" onclick="openLogin()">👤 Вход</div>
</div>

<!-- LOGIN -->
<div id="loginModal" class="modal">
    <div class="modal-box">
        <span class="close" onclick="closeLogin()">✖</span>
        <h2>Системен вход</h2>
        <input id="username" placeholder="Потребител">
        <input type="password" id="password" placeholder="Парола">
        <button onclick="login()">Вход</button>
        <p id="error"></p>
    </div>
</div>

<!-- ADMIN FORM -->
<div class="panel admin-only">
    <h3 id="formTitle">Добавяне на автомобил</h3>

    <input type="file" id="imgFile" accept="image/*">

    <input id="plate" placeholder="Рег. номер">
    <input id="brand" placeholder="Марка">
    <input id="model" placeholder="Модел">
    <input id="year" placeholder="Година">
    <input id="owner" placeholder="Собственик">
    <input id="info" placeholder="Характеристики">

    <button onclick="saveCar()">Запази</button>
</div>

<!-- TABLE -->
<div class="table-box">
<table>
    <thead>
        <tr>
            <th>Снимка</th>
            <th>Рег. номер</th>
            <th>Марка</th>
            <th>Модел</th>
            <th>Година</th>
            <th>Собственик</th>
            <th class="admin-only">Действия</th>
        </tr>
    </thead>
    <tbody id="list"></tbody>
</table>
</div>

<script src="script.js"></script>
</body>
</html>
